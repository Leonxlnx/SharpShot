name: Draft Quick Capture prerelease

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v… Quick Capture tag to build
        required: true
        type: string

concurrency:
  group: quick-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  EXPECTED_RELEASE_TAG: v1.5.0
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Validate exact Quick Capture tag
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ($env:REQUESTED_TAG -cne $env:EXPECTED_RELEASE_TAG) {
            throw "Expected exact tag $env:EXPECTED_RELEASE_TAG; received $env:REQUESTED_TAG"
          }

      - name: Check out the release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Build and self-test Quick Capture
        shell: pwsh
        run: ./build.ps1

      - name: Verify FFmpeg-free Quick artifact
        shell: pwsh
        run: |
          $zip = 'artifacts/native/SharpShot-Quick-1.5.0-win-x64.zip'
          $checksum = "$zip.sha256.txt"
          $line = Get-Content -LiteralPath $checksum
          if (@($line).Count -ne 1 -or $line -notmatch '^([0-9A-Fa-f]{64})  SharpShot-Quick-1\.5\.0-win-x64\.zip$') {
            throw 'Quick Capture checksum sidecar is invalid.'
          }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($actual -cne $Matches[1].ToUpperInvariant()) { throw 'Quick Capture checksum mismatch.' }
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $forbidden = @($archive.Entries | Where-Object {
              $_.FullName -match '(?i)(^|/)(ffmpeg|ffprobe)(\.exe)?$' -or
              $_.FullName -match '(?i)\.dll$'
            })
            if ($forbidden.Count -ne 0) { throw "Quick Capture contains a forbidden media runtime: $($forbidden[0].FullName)" }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload verified Quick assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SharpShot-Quick-1.5.0-release
          path: |
            artifacts/native/SharpShot-Quick-1.5.0-win-x64.zip
            artifacts/native/SharpShot-Quick-1.5.0-win-x64.zip.sha256.txt
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download verified Quick assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SharpShot-Quick-1.5.0-release
          path: release-assets

      - name: Recheck and create Quick draft prerelease
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cne $env:EXPECTED_RELEASE_TAG) {
            throw "Expected exact tag $env:EXPECTED_RELEASE_TAG; received $env:RELEASE_TAG"
          }
          $expected = @(
            'SharpShot-Quick-1.5.0-win-x64.zip'
            'SharpShot-Quick-1.5.0-win-x64.zip.sha256.txt'
          ) | Sort-Object
          $actualNames = @(Get-ChildItem release-assets -File | ForEach-Object Name | Sort-Object)
          if ($actualNames.Count -ne 2 -or (Compare-Object $expected $actualNames)) {
            throw 'Quick release artifact does not match the exact two-file allowlist.'
          }
          $zip = 'release-assets/SharpShot-Quick-1.5.0-win-x64.zip'
          $line = Get-Content 'release-assets/SharpShot-Quick-1.5.0-win-x64.zip.sha256.txt'
          if (@($line).Count -ne 1 -or $line -notmatch '^([0-9A-Fa-f]{64})  SharpShot-Quick-1\.5\.0-win-x64\.zip$') {
            throw 'Quick Capture checksum sidecar is invalid.'
          }
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($actualHash -cne $Matches[1].ToUpperInvariant()) { throw 'Quick Capture checksum mismatch.' }
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $forbidden = @($archive.Entries | Where-Object {
              $_.FullName -match '(?i)(^|/)(ffmpeg|ffprobe)(\.exe)?$' -or
              $_.FullName -match '(?i)\.dll$'
            })
            if ($forbidden.Count -ne 0) { throw "Quick Capture contains a forbidden media runtime: $($forbidden[0].FullName)" }
          }
          finally {
            $archive.Dispose()
          }
          $remoteCommit = gh api "repos/$env:GH_REPO/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $remoteCommit -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve the Quick release tag to a repository commit.'
          }
          $notes = @"
          **Quick Capture** is the lightweight, FFmpeg-free SharpShot edition for screenshots and quick recordings.

          Download `SharpShot-Quick-1.5.0-win-x64.zip`, extract it, and verify the adjacent SHA-256 sidecar. This unsigned prerelease can show an Unknown publisher or SmartScreen warning.

          Do not run Quick Capture and Full Studio simultaneously because both own the same global shortcuts. Full Studio is not part of this release and remains blocked from public distribution until its FFmpeg compliance inventory is verified.

          Source: https://github.com/$env:GH_REPO/tree/$env:RELEASE_TAG
          MIT license: https://github.com/$env:GH_REPO/blob/$env:RELEASE_TAG/LICENSE
          "@
          $assets = Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object FullName
          gh release create $env:RELEASE_TAG @assets --repo $env:GH_REPO `
            --verify-tag --draft --prerelease --latest=false `
            --title "SharpShot Quick Capture 1.5.0" --notes $notes
