name: Draft Quick release

on:
  push:
    tags: [v1.5.0]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Quick tag to build
        required: true
        type: string

concurrency:
  group: quick-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  EXPECTED_RELEASE_TAG: v1.5.0
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Validate exact tag
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ($env:REQUESTED_TAG -cne $env:EXPECTED_RELEASE_TAG) { throw "Expected $env:EXPECTED_RELEASE_TAG; received $env:REQUESTED_TAG" }

      - name: Check out tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Build and self-test
        shell: pwsh
        run: ./build.ps1

      - name: Verify exact FFmpeg-free artifact
        shell: pwsh
        run: |
          $zip = 'artifacts/native/SharpShot-Quick-1.5.0-win-x64.zip'
          $sidecar = "$zip.sha256.txt"
          $line = Get-Content -LiteralPath $sidecar
          if (@($line).Count -ne 1 -or $line -notmatch '^([0-9A-F]{64})  SharpShot-Quick-1\.5\.0-win-x64\.zip$') { throw 'Invalid checksum sidecar.' }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -cne $Matches[1]) { throw 'ZIP checksum mismatch.' }
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = @($archive.Entries | ForEach-Object FullName)
            if ($names -match '(?i)(^|/)(ffmpeg|ffprobe)(\.exe)?$' -or $names -match '(?i)\.dll$' -or $names -match '(?i)(^|/)desktop/') {
              throw 'Quick contains a forbidden Studio/media-runtime file.'
            }
          } finally { $archive.Dispose() }

      - name: Upload verified assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SharpShot-Quick-1.5.0-release
          path: |
            artifacts/native/SharpShot-Quick-1.5.0-win-x64.zip
            artifacts/native/SharpShot-Quick-1.5.0-win-x64.zip.sha256.txt
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SharpShot-Quick-1.5.0-release
          path: release-assets

      - name: Recheck and create draft prerelease
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cne $env:EXPECTED_RELEASE_TAG) { throw 'Unexpected release tag.' }
          $expected = @('SharpShot-Quick-1.5.0-win-x64.zip', 'SharpShot-Quick-1.5.0-win-x64.zip.sha256.txt') | Sort-Object
          $actual = @(Get-ChildItem release-assets -File | ForEach-Object Name | Sort-Object)
          if ($actual.Count -ne 2 -or (Compare-Object $expected $actual)) { throw 'Unexpected release files.' }
          $zip = 'release-assets/SharpShot-Quick-1.5.0-win-x64.zip'
          $line = Get-Content "$zip.sha256.txt"
          if (@($line).Count -ne 1 -or $line -notmatch '^([0-9A-F]{64})  SharpShot-Quick-1\.5\.0-win-x64\.zip$') { throw 'Invalid checksum sidecar.' }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -cne $Matches[1]) { throw 'ZIP checksum mismatch.' }
          gh api "repos/$env:GH_REPO/commits/$env:RELEASE_TAG" --jq .sha | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'The release tag does not exist remotely.' }
          $notes = @"
          **SharpShot Quick 1.5.0** is the tiny native Windows edition for screenshots and quick screen recordings.

          Download the ZIP and checksum, extract it, then double-click `Install.cmd`. The per-user installer verifies every packaged file and runs a synthetic self-test before installation. The build is unsigned, local-only, FFmpeg-free, and MIT licensed.

          Studio is intentionally not included; it remains on a separate development branch for a later release.
          "@
          $assets = Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object FullName
          gh release create $env:RELEASE_TAG @assets --repo $env:GH_REPO --verify-tag --draft --prerelease --latest=false --title 'SharpShot Quick 1.5.0' --notes $notes
